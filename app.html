const dzAutoTxt=k=>{const x=DZAUTO.find(a=>a[0]===k);return x?`Faça no GO! e a missão se cumpre sozinha: ${x[1].toLowerCase()}`:''};
const dzAutoBtn=k=>{const x=DZAUTO.find(a=>a[0]===k);return x?x[2]:'Abrir'};
const dzAutoSel=v=>`<select name="auto"><option value="">Não, só com foto / na mão</option>${DZAUTO.map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}</select>`;
const dzStart=()=>DZ.c.start_date;
const dzDateOf=n=>addDays(DZ.c.start_date,n-1);
const dzRescLeft=()=>Math.max(0,(DZ.c&&DZ.c.rescues!=null?DZ.c.rescues:2)-(DZ.rescUsed||0));
function dzPhases(){const L=[];DZ.missions.slice().sort((a,b)=>a.day-b.day).forEach(m=>{const k=m.pillar||'Jornada',last=L[L.length-1];if(last&&last.name===k){last.to=m.day;last.ms.push(m)}else L.push({name:k,from:m.day,to:m.day,ms:[m]})});return L}
function dzCurPhase(){const n=dzDayN(),P=dzPhases();return P.findIndex(p=>n>=p.from&&n<=p.to)}
function dzPct(){if(!DZ.c||!DZ.me)return 0;const t=today(),j=(DZ.me.joined_at||'').slice(0,10),fs=[DZ.c.start_date,j].sort()[1]||DZ.c.start_date,we=[t,DZ.c.end_date].sort()[0];if(we<fs)return 0;
  const days=daysBetween(fs,we)+1,hp=DZ.habits.reduce((a,h)=>a+h.points,0),mp=DZ.missions.filter(m=>{const d=dzDateOf(m.day);return d>=fs&&d<=we}).reduce((a,m)=>a+m.points,0),pmax=days*hp+mp;
  const got=DZ.checks.filter(k=>k.day>=fs&&k.day<=we).reduce((a,k)=>a+k.points,0);return pmax?Math.min(100,Math.round(got/pmax*100)):0}
function dzMissedMissions(){const n=dzDayN();return DZ.missions.filter(m=>m.day<n-1&&m.day>=1&&!dzMissionDone(m)).sort((a,b)=>b.day-a.day)}
const dzBA=k=>(DZ.mine||[]).filter(p=>p.kind===k);
const dzBAFor=(k,label)=>(DZ.mine||[]).find(p=>p.kind===k&&p.caption===label);

async function dzLoadExtra(){
  if(!DZ.c)return;const cid=DZ.c.id,u=dzUid();
  try{
    const since=new Date(Date.now()-7*864e5).toISOString();
    const [nt,lt,qs,ch,mn]=await Promise.all([
      sb.from('dz_notes').select('*').eq('challenge_id',cid).order('day'),
      sb.from('dz_letters').select('text,created_at').eq('challenge_id',cid).eq('user_id',u).maybeSingle(),
      sb.from('dz_questions').select('*').eq('challenge_id',cid).order('created_at',{ascending:false}).limit(60),
      sb.from('dz_cheers').select('*').eq('challenge_id',cid).gte('created_at',since).order('created_at',{ascending:false}),
      sb.from('dz_posts').select('id,kind,caption,photo_path,mission_id,day,rescue,is_public').eq('challenge_id',cid).eq('user_id',u)]);
    DZ.notes=nt.data||[];DZ.letter=lt.data||null;DZ.qs=qs.data||[];DZ.cheers=ch.data||[];DZ.mine=mn.data||[];DZ.rescUsed=DZ.mine.filter(p=>p.rescue).length;
    DZ.bchecks=[];if(DZ.me&&DZ.me.buddy){const {data}=await sb.from('dz_checks').select('day,habit_id,mission_id,points').eq('challenge_id',cid).eq('user_id',DZ.me.buddy);DZ.bchecks=data||[]}
    const need=DZ.mine.map(p=>p.photo_path).filter(p=>p&&!DZ.urls[p]);
    if(need.length){const {data}=await sb.storage.from(DZ_BUCKET).createSignedUrls(need,6*3600);(data||[]).forEach(x=>{if(x.signedUrl)DZ.urls[x.path]=x.signedUrl})}
  }catch(e){}
  setTimeout(dzAutoSync,300);
}

/* ---------- missões e hábitos automáticos ---------- */
function dzAutoLocal(k,d){const st=state;try{switch(k){
  case 'planejar':return !!(st.dayPlans&&st.dayPlans[d]&&st.dayPlans[d].done);
  case 'planejar_amanha':{const x=addDays(d,1);return !!(st.dayPlans&&st.dayPlans[x]&&st.dayPlans[x].done)}
  case 'semana':{const p=st.plans&&st.plans[weekStart(d)];return !!(p&&((p.identity||'').trim()||(p.focus||[]).length))}
  case 'agua':return (st.water[d]||0)>=(st.settings.waterGoal||2000);
  case 'treino':return !!((st.gym&&st.gym.logs||[]).some(l=>l.date===d&&l.end));
  case 'leitura':return (st.books||[]).some(b=>(b.log||{})[d]>0);
  case 'devocional':return !!(st.devo&&st.devo.entries&&st.devo.entries[d]);
  case 'humor':return !!(st.mood&&st.mood[d]);
}}catch(e){}return false}
const dzHabitAutoLocal=(k,d)=>dzAutoLocal(k,d)||(k==='treino'&&doHabits().some(h=>habitIcon(h)==='dumb'&&h.log&&h.log[d]));
let dzSyncing=false;
async function dzAutoSync(){
  if(dzSyncing||!DZ.c||!DZ.me||!sb||!session)return;dzSyncing=true;let got=0;
  try{const t=today();for(const d of [addDays(t,-1),t]){if(d<DZ.c.start_date||d>DZ.c.end_date)continue;const n=daysBetween(DZ.c.start_date,d)+1,m=dzMission(n);
    if(m&&m.auto&&!dzMissionDone(m)&&dzAutoLocal(m.auto,d)){const {error}=await sb.from('dz_checks').insert({challenge_id:DZ.c.id,day:d,mission_id:m.id});if(!error){DZ.checks.push({day:d,mission_id:m.id,habit_id:null,points:m.points});got+=m.points;toast(`Missão do dia ${n} cumprida pelo GO! ✨ +${m.points} pts`)}}
    for(const h of DZ.habits){if(h.auto&&!dzHabitOn(h,d)&&dzHabitAutoLocal(h.auto,d)){const {error}=await sb.from('dz_checks').insert({challenge_id:DZ.c.id,day:d,habit_id:h.id});if(!error){DZ.checks.push({day:d,habit_id:h.id,mission_id:null,points:h.points});got+=h.points}}}}
  }catch(e){}
  dzSyncing=false;if(got){dzLoadRank().then(render);render()}
}
{const _pr=pushRemote;pushRemote=async function(){await _pr();try{if(DZ.me)dzAutoSync()}catch(e){}}}

  if(n>=len||dzPhase()==='fim')b+=dzFinal();

    b+=`<div class="dzfase ${st}"><div class="dzfh"><span class="dzfn">${st==='ok'?ic('check',14,2.6):i+1}</span><div class="grow"><small>FASE ${i+1} · DIAS ${p.from}–${p.to}</small><b>${esc(p.name)}</b></div><span class="small muted">${dn}/${p.ms.length}</span></div><div class="dzpath">`;

    b+=`</div><div class="dzmark ${st}"><span>${ic('trophy',15)}</span><div class="grow"><b>${st==='ok'?'Fase concluída!':'Marco da fase'}</b><small>${st==='ok'?`${dn} de ${p.ms.length} missões${nt?' · recado liberado: '+esc(nt.title):''}`:nt?'libera: recado da nutri "'+esc(nt.title)+'"':'conclua a fase pra liberar'}</small></div></div></div>`});

    return `<div class="dzbrow"><div class="dzbal">${esc(lb)}</div><div class="dzbap"><button data-a="sheet" data-s="dzProof" data-kind="antes" data-p="${esc(lb)}" class="${a?'has':''}">${ua?`<img src="${ua}" alt="">`:`${ic('camera',18)}<small>antes</small>`}</button><button ${depOn?`data-a="sheet" data-s="dzProof" data-kind="depois" data-p="${esc(lb)}"`:'disabled'} class="${d?'has':''}">${ud?`<img src="${ud}" alt="">`:depOn?`${ic('camera',18)}<small>depois</small>`:`${ic('lock',14)}<small>no fim</small>`}</button></div></div>`}).join('')}</div>`;

  return b;
}

function dzBeforeAfterSheet(kind){const lb=DZ._baP||DZBA[0][0],cur=dzBAFor(kind,lb);return `<h3>${kind==='antes'?'foto do antes':'foto do depois'}</h3><div class="small muted" style="margin:-6px 0 14px">${esc(lb)}${kind==='depois'?' · mesmo ângulo da foto de antes, se der':''}</div>${cur?`<div class="note" style="margin:-4px 0 12px">Você já tem essa foto. Enviar outra substitui.</div>`:''}${dzPicker('Tirar ou escolher foto')}<form data-f="dzBA" style="margin-top:14px">${hid('k',kind)}${hid('p',lb)}<label class="dztog"><input type="checkbox" name="pub" ${lb.includes('só você')?'disabled':''}><span><b>Mostrar na comunidade</b><small>Desmarcado: só você e a organizadora veem.</small></span></label><button class="btn primary full" ${DZ.busy?'disabled':''}>${DZ.busy?'Enviando…':'Salvar foto'}</button></form>`}
{const _sh=A.sheet;A.sheet=d=>{if(d&&d.s==='dzProof'&&d.kind)DZ._baP=d.p;return _sh(d)}}

/* ---------- ações ---------- */
Object.assign(A,{
  dzAutoGo:d=>{closeSheet();const k=d.k;if(k==='planejar'){A.dpOpen();return}if(k==='planejar_amanha'){A.dpTomorrow();return}if(k==='semana'){ui.planMode='semana';ui.screen='semana';render();return}
    if(k==='treino'){ui.screen='treinos';ui.gymTab='hoje';render();return}if(k==='leitura'){ui.screen='leitura';render();return}if(k==='devocional'){ui.screen='devocional';render();return}
    if(k==='humor'){ui.screen='home';render();openSheet('moodPick',{});return}ui.screen='home';render();window.scrollTo(0,0)},
  dzCheer:async()=>{const bd=DZ.me&&DZ.me.buddy;if(!bd)return;const {data,error}=await sb.from('dz_cheers').insert({challenge_id:DZ.c.id,to_user:bd}).select('*').single();if(error){toast(dzErr(error));return}DZ.cheers.unshift(data);if(navigator.vibrate)navigator.vibrate(15);toast('Força enviada 💪');render()},
  dzShareDay:d=>{closeSheet();dzShareCard(+d.n)},
  dzCert:()=>dzCertCard()
});
function dzAfterMission(m){if(dzMissionDone(m))openSheet('dzShareAsk',{n:m.day})}
SH.dzShareAsk=d=>`<div style="text-align:center"><div class="script" style="font-size:30px;color:var(--rose-d)">missão cumprida!</div><div class="small muted" style="margin:6px 0 16px">Que tal mostrar pro mundo? Um card bonito pros seus stories.</div><button class="btn primary full" data-a="dzShareDay" data-n="${d.n}">${ic('send',15)} Criar card dos stories</button><button class="btn ghost full" style="margin-top:8px" data-a="closeSheet">Agora não</button></div>`;
if(!A.closeSheet)A.closeSheet=()=>closeSheet();
Object.assign(F,{
  dzLetter:async v=>{const t_=(v.t||'').trim();if(!t_){toast('Escreva alguma coisa 💛');return}const row={challenge_id:DZ.c.id,text:t_.slice(0,3000)};
    const {error}=DZ.letter?await sb.from('dz_letters').update({text:row.text}).eq('challenge_id',DZ.c.id).eq('user_id',dzUid()):await sb.from('dz_letters').insert(row);
    if(error){toast(dzErr(error));return}DZ.letter={text:row.text,created_at:(DZ.letter&&DZ.letter.created_at)||new Date().toISOString()};closeSheet();toast('Carta selada 💌 Ela abre no último dia.');render()},
  dzAsk:async v=>{const t_=(v.t||'').trim();if(!t_)return;const {data,error}=await sb.from('dz_questions').insert({challenge_id:DZ.c.id,text:t_.slice(0,600)}).select('*').single();if(error){toast(dzErr(error));return}DZ.qs.unshift(data);closeSheet();toast('Pergunta enviada! A resposta aparece na Jornada.');render()},
  dzBA:async v=>{if(DZ.busy)return;if(!DZ.file){toast('Escolha uma foto');return}DZ.busy=true;openSheet('dzProof',{kind:v.k,p:v.p});
    try{const old=dzBAFor(v.k,v.p);const path=await dzUpload(DZ.file);const {error}=await sb.from('dz_posts').insert({challenge_id:DZ.c.id,kind:v.k,caption:v.p,photo_path:path,is_public:!!v.pub});if(error){sb.storage.from(DZ_BUCKET).remove([path]);throw error}
      if(old){await sb.from('dz_posts').delete().eq('id',old.id);if(old.photo_path)sb.storage.from(DZ_BUCKET).remove([old.photo_path])}
      dzClearFile();closeSheet();toast(v.k==='antes'?'Foto do antes guardada 📸':'Foto do depois guardada. Compare na Jornada ✨')}catch(e){toast(dzErr(e))}
    DZ.busy=false;await dzLoadExtra();render()},
  dzAdmN:async v=>{const row={day:Math.max(1,parseInt(v.day,10)||1),title:v.title.trim(),body:(v.body||'').trim()||null};const q=v.id?sb.from('dz_notes').update(row).eq('id',v.id):sb.from('dz_notes').insert({...row,challenge_id:DZ.c.id});const {error}=await q;if(error){toast(dzErr(error));return}closeSheet();await dzLoadExtra();render()},
  dzAns:async v=>{const {error}=await sb.from('dz_questions').update({answer:(v.a||'').trim()||null,answered_at:new Date().toISOString()}).eq('id',v.id);if(error){toast(dzErr(error));return}const q=DZ.qs.find(x=>x.id===v.id);if(q)q.answer=(v.a||'').trim();closeSheet();toast('Resposta publicada 💛');render()}
});

/* ---------- painel: recados, perguntas, duplas ---------- */
function dzAdminExtras(){
  const pend=DZ.qs.filter(q=>!q.answer),pairs=Object.values(DZ.members).filter(m=>m.buddy).length/2;
  return `<h2 class="sec">perguntas da caixinha ${pend.length?`<span class="tag">${pend.length} nova${pend.length>1?'s':''}</span>`:''}</h2><div class="card" style="margin-top:0">${DZ.qs.map(q=>`<button class="row dznl" data-a="sheet" data-s="dzAdmQ" data-id="${q.id}"><span class="dznq sm">${ic(q.answer?'check':'chat',13)}</span><div class="grow rt">${esc(q.text.slice(0,90))}<div class="small muted">${q.answer?'respondida':'aguardando resposta'} · ${dzAgo(q.created_at)}</div></div>${ic('chevR',15)}</button>`).join('')||'<div class="empty">Nenhuma pergunta ainda.</div>'}</div>
  <h2 class="sec">recados da nutri <button class="btn sm soft" data-a="sheet" data-s="dzAdmN">${ic('plus',14)} Novo</button></h2><div class="card" style="margin-top:0">${(DZ.notes||[]).map(x=>`<div class="row"><span class="dzpos">${x.day}</span><div class="grow rt">${esc(x.title)}</div><button class="ib sm" data-a="sheet" data-s="dzAdmN" data-id="${x.id}">${ic('edit',15)}</button></div>`).join('')||'<div class="empty">Nenhum recado.</div>'}<div class="small muted" style="margin-top:8px">O recado aparece pras participantes a partir do dia escolhido.</div></div>
  <h2 class="sec">duplas de apoio</h2><div class="card" style="margin-top:0"><div class="small" style="line-height:1.6">As duplas se formam sozinhas quando alguém entra. ${pairs?`Hoje são ${Math.floor(pairs)} duplas.`:''} Se quiser, sorteie de novo (dentro de cada liga).</div><button class="btn soft full" style="margin-top:10px" data-a="dzPairAll">${ic('refresh',14)} Sortear duplas de novo</button></div>`}
SH.dzAdmN=d=>{const x=(DZ.notes||[]).find(n=>n.id===d.id)||{day:dzDayN()>0?dzDayN():1};return `<h3>${x.id?'editar recado':'novo recado'}</h3><form data-f="dzAdmN">${hid('id',x.id)}${fld('Libera no dia',`<input name="day" inputmode="numeric" required value="${x.day}">`)}${fld('Título',`<input name="title" required maxlength="80" value="${esc(x.title||'')}">`)}${fld('Recado',`<textarea name="body" rows="8" maxlength="3000">${esc(x.body||'')}</textarea>`)}<button class="btn primary full">Salvar</button></form>${x.id?`<button class="btn ghost full" style="margin-top:8px" data-a="dzAdmDelN" data-id="${x.id}">${ic('trash',15)} Excluir recado</button>`:''}`};
SH.dzAdmQ=d=>{const q=DZ.qs.find(x=>x.id===d.id);if(!q)return '';return `<h3>pergunta</h3><div class="card" style="margin:0 0 12px"><div>${esc(q.text)}</div><div class="small muted" style="margin-top:6px">${esc(dzMem(q.user_id).nickname)} · ${dzAgo(q.created_at)} · só você vê quem perguntou</div></div><form data-f="dzAns">${hid('id',q.id)}${fld('Sua resposta (aparece pra todas, sem o nome)',`<textarea name="a" rows="6" maxlength="3000">${esc(q.answer||'')}</textarea>`)}<button class="btn primary full">${q.answer?'Atualizar resposta':'Responder'}</button></form>`};
Object.assign(A,{
  dzAdmDelN:async d=>{if(!confirm('Excluir este recado?'))return;await sb.from('dz_notes').delete().eq('id',d.id);closeSheet();await dzLoadExtra();render()},
  dzPairAll:async()=>{if(!confirm('Sortear as duplas de novo? As duplas atuais serão desfeitas.'))return;const {data,error}=await sb.rpc('dz_pair_all',{cid:DZ.c.id});if(error){toast(dzErr(error));return}toast(`${data} duplas formadas 💛`);DZ.loaded=false;await dzLoad(true)}
});
{const _al=dzAdminLoad;dzAdminLoad=async function(){await dzLoadExtra();await _al()}}
{const _ml=dzLoadFeed;dzLoadFeed=async function(){await _ml();const {data}=await sb.from('dz_members').select('user_id,buddy').eq('challenge_id',DZ.c.id);(data||[]).forEach(x=>{if(DZ.members[x.user_id])DZ.members[x.user_id].buddy=x.buddy})}}

/* ---------- cards para stories e certificado ---------- */
async function dzCanvas(draw,name){
  try{await Promise.all(["700 80px Gazpacho","400 60px 'Dancing Script'","500 40px Poppins","400 40px Poppins"].map(f=>document.fonts.load(f).catch(()=>{})))}catch(e){}
  const cv=document.createElement('canvas');cv.width=1080;cv.height=1920;const x=cv.getContext('2d');const cs=getComputedStyle(document.documentElement),V=k=>(cs.getPropertyValue(k)||'').trim();
  const P={bg:V('--bg')||'#fcf9f8',rbg:V('--rbg')||'#f4e9e5',deep:V('--deep')||'#7d6157',hi:V('--deep-hi')||'#a8877a',lo:V('--deep-lo')||'#5c463e',ink:V('--ink')||'#2b2627',rose:V('--rose-d')||'#b07d6e'};
  const g=x.createLinearGradient(0,0,0,1920);g.addColorStop(0,P.bg);g.addColorStop(1,P.rbg);x.fillStyle=g;x.fillRect(0,0,1080,1920);
  x.fillStyle=P.rose;x.globalAlpha=.12;for(let yy=0;yy<1920;yy+=54)for(let xx=(yy/54)%2?27:0;xx<1080;xx+=54){x.beginPath();x.arc(xx,yy,4,0,7);x.fill()}x.globalAlpha=1;
  draw(x,P);
  x.fillStyle=P.rose;x.font="500 30px Poppins";x.textAlign='center';x.fillText('GO! · usegoapp.com.br',540,1840);
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const file=new File([blob],name,{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('Imagem salva 📸');
}
function dzRR(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}
function dzWrap(x,t,X,Y,maxW,lh){const w=String(t).split(' ');let line='',yy=Y;for(const s of w){const tt=line?line+' '+s:s;if(x.measureText(tt).width>maxW&&line){x.fillText(line,X,yy);line=s;yy+=lh}else line=tt}if(line)x.fillText(line,X,yy);return yy}
function dzGloss(x,P,X,Y,W,H){const g=x.createLinearGradient(X,Y,X+W,Y+H);g.addColorStop(0,P.hi);g.addColorStop(.55,P.deep);g.addColorStop(1,P.lo);x.save();x.shadowColor='rgba(60,40,35,.35)';x.shadowBlur=60;x.shadowOffsetY=24;dzRR(x,X,Y,W,H,64);x.fillStyle=g;x.fill();x.restore();
  x.save();dzRR(x,X,Y,W,H,64);x.clip();const r=x.createRadialGradient(X+W*.15,Y-40,10,X+W*.15,Y,W*.8);r.addColorStop(0,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=r;x.fillRect(X,Y,W,H);x.restore()}
function dzShareCard(n){const m=dzMission(n);if(!m)return;const nick=DZ.me?DZ.me.nickname:'';
  dzCanvas((x,P)=>{x.textAlign='center';x.fillStyle=P.rose;x.font="500 34px Poppins";x.fillText(('desafio '+DZ.c.title).toUpperCase().split('').join(String.fromCharCode(8202)),540,250);
    x.fillStyle=P.ink;x.font="400 120px Gazpacho";x.fillText(`dia ${n}`,540,420);x.fillStyle=P.rose;x.font="400 56px 'Dancing Script'";x.fillText(`de ${dzLen()}`,540,500);
    dzGloss(x,P,110,600,860,640);x.fillStyle='rgba(255,255,255,.75)';x.font="500 30px Poppins";x.fillText((m.pillar||'missão').toUpperCase(),540,700);
    x.fillStyle='#fff';x.font="400 70px Gazpacho";const ye=dzWrap(x,m.title,540,820,720,86);
    x.beginPath();x.arc(540,ye+150,60,0,7);x.fillStyle='rgba(255,255,255,.95)';x.fill();x.strokeStyle=P.deep;x.lineWidth=12;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(512,ye+152);x.lineTo(532,ye+172);x.lineTo(570,ye+130);x.stroke();
    x.fillStyle=P.ink;x.font="400 64px 'Dancing Script'";x.fillText('missão cumprida',540,1400);x.fillStyle=P.ink;x.font="400 38px Poppins";dzWrap(x,`${nick?nick+' · ':''}um passo de cada vez, todo dia`,540,1480,820,52);
    x.fillStyle=P.rose;x.font="500 32px Poppins";x.fillText(`${dzPct()}% de constância`,540,1620)},`go-desafio-dia-${n}.png`)}
function dzCertCard(){const nick=DZ.me?DZ.me.nickname:'',act=new Set(DZ.checks.map(k=>k.day)).size,dn=DZ.missions.filter(dzMissionDone).length;
  dzCanvas((x,P)=>{x.textAlign='center';dzGloss(x,P,90,200,900,1500);x.fillStyle='rgba(255,255,255,.75)';x.font="500 32px Poppins";x.fillText('CERTIFICADO DE CONSTÂNCIA',540,330);
    x.fillStyle='#fff';x.font="400 54px 'Dancing Script'";x.fillText('este certificado é de',540,470);x.font="400 110px Gazpacho";dzWrap(x,nick||'você',540,610,760,110);
    x.font="400 40px Poppins";x.fillStyle='rgba(255,255,255,.9)';dzWrap(x,`que completou o desafio ${DZ.c.title}, aparecendo por si mesma dia após dia.`,540,760,740,58);
    const st=[[`${dzPct()}%`,'constância'],[`${act}`,'dias ativos'],[`${dn}`,'missões']];st.forEach(([a,b],i)=>{const X=240+i*300;x.fillStyle='#fff';x.font="400 90px Gazpacho";x.fillText(a,X,1080);x.font="400 30px Poppins";x.fillStyle='rgba(255,255,255,.8)';x.fillText(b,X,1130)});
    x.fillStyle='#fff';x.font="400 60px 'Dancing Script'";x.fillText('constância não é nunca falhar,',540,1330);x.fillText('é sempre voltar.',540,1405);
    x.font="400 30px Poppins";x.fillStyle='rgba(255,255,255,.8)';x.fillText(`${fmtD(DZ.c.start_date)} a ${fmtD(DZ.c.end_date)}`,540,1580)},'certificado-constancia.png')}

</script>
