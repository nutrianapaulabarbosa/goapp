<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf5f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GO!</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Dancing+Script:wght@600&family=Playfair+Display&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
@font-face{font-family:'Gazpacho';src:url('fonts/Gazpacho-Regular.otf') format('opentype');font-weight:400;font-display:swap}
:root{--serif:'Gazpacho','Playfair Display',Georgia,serif;--script:'Dancing Script',cursive;
  --bg:#faf5f3;--card:#fff;--ink:#2b2023;--plum:#3a2a2e;--plum2:#4a3639;
  --rose:#d89aa8;--rose-d:#bf7486;--rose-l:#f7e5e9;
  --sage:#9cc5a1;--sage-l:#e4f0e5;--sky:#a9c6d3;--sky-l:#e2edf2;
  --sand:#c9b38f;--sand-l:#f1e9dc;--lav:#b9a7d1;--lav-l:#ece6f4;
  --muted:#8a7a7e;--line:#efe4e4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Poppins,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:calc(112px + env(safe-area-inset-bottom));font-size:15px}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 0}
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose-d);font-weight:600}
.hi{font-family:var(--serif);font-weight:400;font-size:28px;margin-top:6px;line-height:1.15}
.hi em{color:var(--rose-d)}
.streak{font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center}
.streak svg{color:var(--rose-d)}
.titleRow{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.tic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--plum)}
.ttl{font-family:var(--serif);font-size:26px;font-weight:400}
.hicons{display:flex;gap:4px;align-items:center;margin-left:auto;flex:none}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:none;border:0;position:relative;flex:none}
.ib.sm{width:32px;height:32px;color:var(--muted)}
.badge{position:absolute;top:2px;right:2px;background:var(--rose-d);color:#fff;font-size:10px;font-weight:600;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--rose);color:#fff;font-weight:600;display:grid;place-items:center;border:0;font-size:16px}
.hero{background:var(--plum);color:#fff;border-radius:26px;padding:18px;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07);top:-60px;right:-50px}
.hero:after{content:'';position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.04);bottom:-80px;right:60px}
.hero>*{position:relative;z-index:1}
.htabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-2px -4px 16px;padding:0 4px}
.htabs::-webkit-scrollbar{display:none}
.htabs button{flex:none;background:rgba(255,255,255,.09);color:#fff;border:0;border-radius:20px;padding:7px 13px;font-size:13px}
.htabs button.on{background:var(--rose);color:var(--plum);font-weight:600}
.hmain{display:flex;gap:16px;align-items:center;min-height:100px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-family:var(--serif);font-weight:400;font-size:22px}
.ring b sup{font-size:13px}
.ring small{font-size:9px;letter-spacing:.12em;opacity:.7;text-transform:uppercase}
.hk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:600}
.hk.g{color:var(--sage)}.hk.s{color:var(--sand)}
.hT{font-family:var(--serif);font-size:22px;margin:4px 0;line-height:1.2}
.hS{font-size:13px;opacity:.82;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats.two{grid-template-columns:1fr 1fr}
.stat{background:rgba(255,255,255,.09);border-radius:16px;padding:12px}
.stat b{font-size:19px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;opacity:.75}
.dots{display:flex;gap:5px;justify-content:center;margin-top:14px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);transition:.2s}
.dots i.on{width:22px;background:var(--rose)}
.hlink{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:14px;padding:5px 11px;font-size:12px;margin-top:8px}
.moods{display:flex;gap:6px;margin-top:8px}
.moods button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.1);font-size:19px}
.moods button.on{background:var(--rose)}
.quick{display:flex;align-items:center;gap:10px;background:#fff;border-radius:30px;padding:6px 6px 6px 16px;box-shadow:0 4px 18px rgba(58,42,46,.08);margin-top:18px;border:1px solid var(--line)}
.quick svg.lead{color:var(--rose-d);flex:none}
.quick input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:none;min-width:0;color:var(--ink)}
.quick button{width:44px;height:44px;border-radius:50%;background:var(--rose);border:0;color:#fff;display:grid;place-items:center;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13px;flex:none}
.chip.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.sec{font-family:var(--serif);font-weight:400;font-size:22px;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.area{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 6px 12px;text-align:center}
.area .tic{margin:0 auto 8px}
.area b{font-size:14px;font-weight:600;display:block}
.area span{font-size:11.5px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}
.card h4{font-family:var(--serif);font-weight:400;font-size:19px}
.cardHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.rt{font-size:15px;line-height:1.3;word-break:break-word}
.time{font-size:13px;font-weight:600;color:var(--rose-d);width:44px;flex:none}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:30px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:8px 14px;border-radius:24px;font-size:13.5px;color:var(--muted);flex:none;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--plum);color:#fff}
.btn{border:0;border-radius:24px;padding:11px 18px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--rose);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.soft{background:var(--rose-l);color:var(--rose-d)}
.btn.ok{background:var(--sage);color:#fff}
.btn.full{width:100%}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btnrow{display:flex;gap:8px;margin-top:14px}
.btnrow .btn{flex:1}
.cb{width:24px;height:24px;border-radius:8px;border:1.6px solid #d8c9cc;display:grid;place-items:center;flex:none;background:#fff;color:#fff;padding:0}
.cb.on{background:var(--sage);border-color:var(--sage)}
.done-t{text-decoration:line-through;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.empty{color:var(--muted);font-size:14px;padding:12px 0;text-align:center}
.dayhead{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 2px}
.dayhead.today{color:var(--rose-d)}
.navrow{display:flex;align-items:center;gap:8px;margin-top:18px}
.pill{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-size:13px}
.circ{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;padding:0;flex:none}
.wk{display:flex;gap:6px;margin-top:14px}
.wk button{flex:1;border-radius:18px;border:1px solid var(--line);background:#fff;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
.wk small{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.wk b{font-size:16px;font-weight:600}
.wk i{width:5px;height:5px;border-radius:50%;background:transparent}
.wk i.has{background:var(--rose)}
.wk .on{background:var(--rose);border-color:var(--rose);color:#fff}
.wk .on small{color:#fff}.wk .on i.has{background:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal .h{font-size:10.5px;color:var(--muted);text-align:center;padding-bottom:4px;text-transform:uppercase}
.cal button{aspect-ratio:1;border:0;border-radius:12px;background:#fff;font-size:13px;position:relative;display:grid;place-items:center}
.cal button.out{opacity:.3}
.cal button.today{outline:1.5px solid var(--rose);}
.cal button.sel{background:var(--rose);color:#fff}
.cal button i{position:absolute;bottom:5px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--rose-d)}
.cal button.sel i{background:#fff}
.hw{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;text-align:center}
.hw .hwb{height:30px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden;display:flex;align-items:flex-end}
.hw .hwb em{display:block;width:100%;background:var(--sage)}.hw .hwc{min-width:0;text-align:center}
.hw span{font-size:11px;opacity:.7;display:block;margin-top:5px}
.hw span.t{opacity:1;font-weight:600}
.hcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px 12px 12px 14px;margin-top:10px}
.hrow{display:flex;align-items:center;gap:10px}
.hic{width:36px;height:36px;border-radius:50%;background:var(--sage-l);color:#6e9f75;display:grid;place-items:center;flex:none}
.hcard b{font-weight:500;font-size:15px}
.sagec{color:#6e9f75}.fl{color:#d98b4a;font-weight:600}
.grid28{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:12px}
.grid28 i{aspect-ratio:1;border-radius:4px;background:#f2eaeb}
.grid28 i.on{background:var(--sage)}.grid28 i.off{background:transparent;border:1px dashed #eadfe0}
.bar{height:9px;border-radius:5px;background:#f2e8ea;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.cups{display:flex;gap:7px;margin:14px 0;flex-wrap:wrap}
.cups svg{color:var(--sky)}.cups svg.f{color:#7fa9bb;fill:#d6e6ee}
.sbars{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:14px;position:relative;border-bottom:1px solid var(--line)}
.sbars .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--rose);opacity:.6}
.sbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.sbars em{display:block;width:100%;max-width:30px;border-radius:9px 9px 3px 3px;background:var(--lav-l)}
.sbars em.l{background:var(--lav)}
.slabels{display:flex;gap:8px;margin-top:5px}.slabels span{flex:1;text-align:center;font-size:10.5px;color:var(--muted)}
.big{font-family:var(--serif);font-size:22px}
.big small{font-size:13px;color:var(--muted)}
.subcard{background:var(--bg);border-radius:16px;padding:14px;margin-top:12px}
.amt{font-weight:600;font-size:14px;white-space:nowrap}
.amt.in{color:#5f9467}
.paid{font-size:11px;border-radius:10px;padding:3px 8px;border:0;background:var(--rose-l);color:var(--rose-d);font-weight:600}
.paid.on{background:var(--sage-l);color:#5f9467}
.lcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px;display:block;width:100%;text-align:left}
.lcard ul{list-style:none;margin:12px 0}
.lcard li{font-size:13.5px;padding:2px 0;display:flex;gap:8px;align-items:center}
.lcard li:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--sage);flex:none}
.lcard li.d{color:#b9aaad;text-decoration:line-through}.lcard li.d:before{background:#e3d8da}
.lic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 14px;margin-top:12px;color:var(--muted)}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;padding:12px 0;color:var(--ink)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;outline:0;background:#fff;min-width:0}
.ex{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ex button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.ex button span{color:var(--muted);font-size:12px;white-space:nowrap}
.mitem{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;width:100%;text-align:left}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(58,42,46,.08);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20;-webkit-transform:translateZ(0);height:auto;overflow:visible}
nav.bar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted)}
nav.bar button.on{color:var(--ink);font-weight:600}
nav.bar button.on svg{color:var(--rose-d)}
nav.bar .fab{width:56px;height:56px;border-radius:50%;background:var(--rose);color:#fff;margin:-30px auto 0;box-shadow:0 6px 18px rgba(216,154,168,.6);justify-content:center}
.ov{position:fixed;inset:0;background:rgba(43,32,35,.38);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease;position:relative;overscroll-behavior:contain}
.sheet .xclose{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;color:var(--muted);z-index:2}
.sheet .grab{width:44px;height:5px;margin:2px auto 16px;cursor:grab}
.avatar{overflow:hidden;padding:0}.avatar img,.bigav img{width:100%;height:100%;object-fit:cover;display:block}
.bigav{width:76px;height:76px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:500;overflow:hidden;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:#e3d6d8;margin:4px auto 14px}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:23px;margin-bottom:14px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);outline:0;-webkit-appearance:none;appearance:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:5px}
.days label{flex:1}.days input{display:none}
.days span{display:block;text-align:center;padding:10px 0;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:12px}
.days input:checked+span{background:var(--plum);color:#fff;border-color:var(--plum)}
.tog{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px}
.tog input{width:20px;height:20px;accent-color:var(--rose-d)}
.fabgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fabgrid button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));background:var(--plum);color:#fff;padding:12px 16px;border-radius:16px;font-size:13.5px;display:flex;gap:14px;align-items:center;z-index:60;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:var(--rose);font-weight:600;flex:none}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:10px}
/* tipografia da marca */
body{font-weight:300}
b,strong,.btn,.chip.on,.seg button.on,.stat b,.amt,.time,nav.bar button.on{font-weight:500}
.ttl,.sec,.sheet h3,.hi,.card h4{text-transform:lowercase}
.hi em,.script{font-family:var(--script);font-weight:600;font-style:normal;text-transform:none;font-size:1.18em;color:var(--rose-d)}
input,select,textarea{font-weight:400}
/* logo + boas-vindas */
.logo{display:inline-flex;align-items:center;gap:10px}
.logo .wm{font-family:var(--serif);font-size:30px;letter-spacing:.01em;color:var(--plum);line-height:1}
.splash{min-height:80vh;display:grid;place-content:center;text-align:center;gap:14px}
.welcome{padding-top:6vh;text-align:center}
.welcome .tag{font-family:var(--serif);font-size:26px;line-height:1.25;margin:22px 0 10px;text-transform:lowercase}
.welcome p{color:var(--muted);font-size:14px;line-height:1.6;max-width:320px;margin:0 auto}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:26px 0}
.feat div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label input{display:none}
.pick label span{display:block;background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:13px}
.pick label input:checked+span{background:var(--plum);color:#fff;border-color:var(--plum)}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
.steps i{width:22px;height:5px;border-radius:3px;background:#eadfe1}.steps i.on{background:var(--rose)}
.areas{grid-template-columns:repeat(4,1fr);gap:8px}
.area{padding:12px 4px 10px;border-radius:18px}.area .tic{width:40px;height:40px;border-radius:13px}.area b{font-size:12.5px}.area span{font-size:10.5px}
.rcard{padding:18px}.rhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpis div{background:var(--bg);border-radius:14px;padding:10px 11px}
.kpis b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis span{font-size:11px;color:var(--muted)}.kpis i{display:block;font-style:normal;font-size:11px;margin-top:2px}
.up{color:#5f9467}.down{color:var(--rose-d)}
.rbars{display:flex;align-items:flex-end;gap:3px;height:110px;position:relative;margin-top:14px;border-bottom:1px solid var(--line)}

  [local,cur].forEach(s=>{if(s&&s.v&&s._uid===session.user.id&&(!best||(s.updatedAt||0)>(best.updatedAt||0)))best=s});

const sched=(h,d)=>d>=h.created&&h.days.includes(parseISO(d).getDay());
const hDone=(h,d)=>!!h.log[d]||(h.auto==='water'&&(state.water[d]||0)>=state.settings.waterGoal);
function hStreak(h){let d=today(),n=0;if(sched(h,d)&&!hDone(h,d))d=addDays(d,-1);for(let i=0;i<500&&d>=h.created;i++){if(sched(h,d)){if(hDone(h,d))n++;else break}d=addDays(d,-1)}return n}
function dayRatio(d){const hs=doHabits().filter(h=>sched(h,d));if(!hs.length)return null;return hs.filter(h=>hDone(h,d)).length/hs.length}
function allStreak(){const first=doHabits().reduce((m,h)=>h.created<m?h.created:m,today());let d=today(),n=0;if(dayRatio(d)!==1)d=addDays(d,-1);for(let i=0;i<500&&d>=first;i++){const r=dayRatio(d);if(r===1)n++;else if(r!==null)break;d=addDays(d,-1)}return n}
function monthHabitPct(){const t=today();let s=0,dn=0;for(let d=t.slice(0,8)+'01';d<=t;d=addDays(d,1)){doHabits().forEach(h=>{if(sched(h,d)){s++;if(hDone(h,d))dn++}})}return s?Math.round(dn/s*100):0}
function appStreak(){let d=today(),n=0;if(!state.activeDays[d])d=addDays(d,-1);while(state.activeDays[d]){n++;d=addDays(d,-1)}return n}
const sortEv=(a,b)=>(a.date+(a.time||'00:00')).localeCompare(b.date+(b.time||'00:00'));
const eventsOn=d=>state.events.filter(e=>e.date===d).sort(sortEv);
const tasksOn=d=>state.tasks.filter(t=>t.date===d);
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);
function finMonth(m){
  const es=state.fin.entries.filter(e=>e.recurring?(ym(e.date)<=m&&(!e.end||e.end>=m)):ym(e.date)===m);
  const inc=es.filter(e=>e.type==='in'),out=es.filter(e=>e.type==='out');
  const fixed=out.filter(e=>e.recurring),vari=out.filter(e=>!e.recurring).sort((a,b)=>b.date.localeCompare(a.date));
  const sum=a=>a.reduce((s,e)=>s+e.amount,0);
  const paid=state.fin.paid[m]||{};const toPay=fixed.filter(e=>!paid[e.id]);
  const I_=sum(inc),O=sum(out);
  return {inc,fixed,vari,paid,toPay,totIn:I_,totOut:O,totFixed:sum(fixed),totVar:sum(vari),left:I_-O,toPaySum:sum(toPay),pct:I_>0?Math.max(0,Math.round((I_-O)/I_*100)):0};
}
const dueDate=(e,m)=>{const[y,mo]=m.split('-').map(Number);const last=new Date(y,mo,0).getDate();return m+'-'+pad(Math.min(e.day||1,last))};
function alerts(){
  const t=today(),a=[];
  state.tasks.filter(x=>!x.done&&x.date&&x.date<=t).forEach(x=>a.push({k:x.date<t?'Atrasada':'Hoje',txt:x.title,go:'tarefas'}));
  const m=ym(t),f=finMonth(m);
  f.toPay.forEach(e=>{const dd=dueDate(e,m);if(dd<=addDays(t,3))a.push({k:dd<t?'Conta vencida':'Vence '+dateLabel(dd).toLowerCase(),txt:`${e.desc} · ${money(e.amount)}`,go:'financas'})});
  const ml=state.medLog[t]||{};state.meds.forEach(md=>{if(!ml[md.id]&&(!md.time||md.time<=nowHM()))a.push({k:'Remédio '+(md.time||''),txt:md.name,go:'saude'})});
  return a;
}

/* ---------- componentes ---------- */
function ring(p,color,big,small,size=96){const r=size/2-7,c=2*Math.PI*r,o=c*(1-Math.min(1,Math.max(0,p)));return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,.12)" stroke-width="7" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg><div class="lbl"><b>${big}</b><small>${small}</small></div></div>`}
const pctBig=n=>`${n}<sup>%</sup>`;
const stats=(arr,cls='')=>`<div class="stats ${cls}">${arr.map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('')}</div>`;
function hIcons(){const n=alerts().length;return `<div class="hicons"><button class="ib" data-a="sheet" data-s="bell" aria-label="Avisos">${ic('bell',20)}${n?`<span class="badge">${n}</span>`:''}</button><button class="avatar" data-a="go" data-to="menu" aria-label="Menu">${state.avatar?`<img src="${state.avatar}" alt="">`:esc((state.name||'A').charAt(0).toUpperCase())}</button></div>`}
const titleHdr=(icon,title,bg)=>`<div class="top" style="align-items:center"><div class="titleRow"><div class="tic" style="background:${bg}">${ic(icon,21)}</div><div class="ttl">${title}</div></div>${hIcons()}</div>`;
const backHdr=(title,to)=>`<div class="top" style="align-items:center"><div class="titleRow"><button class="circ" data-a="go" data-to="${to}">${ic('chevL',18)}</button><div class="ttl" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(title)}</div></div>${hIcons()}</div>`;
const catLbl={geral:'Geral',saude:'Saúde',trabalho:'Trabalho',pessoal:'Pessoal'};
function evRow(e,showDate){return `<div class="row"><div class="time">${e.time||'Dia'}</div><div class="grow"><div class="rt">${esc(e.title)}</div><div class="small muted">${showDate?dateLabel(e.date)+' · ':''}${catLbl[e.cat]||'Geral'}</div></div><button class="ib sm" data-a="editEvent" data-id="${e.id}">${ic('edit',16)}</button><button class="ib sm" data-a="delEvent" data-id="${e.id}">${ic('trash',16)}</button></div>`}
function tkRow(x,showDate){const late=!x.done&&x.date&&x.date<today();return `<div class="row"><button class="cb ${x.done?'on':''}" data-a="toggleTask" data-id="${x.id}" aria-label="Concluir">${x.done?ic('check',14,2.4):''}</button><div class="grow" data-a="editTask" data-id="${x.id}"><div class="rt ${x.done?'done-t':''}">${esc(x.title)}</div>${showDate&&x.date?`<div class="small" style="color:${late?'var(--rose-d)':'var(--muted)'}">${late?'Atrasada · ':''}${dateLabel(x.date)}</div>`:''}</div><button class="ib sm" data-a="delTask" data-id="${x.id}">${ic('trash',16)}</button></div>`}
const quickForm=(ph='Escreva e o GO! organiza')=>`<form class="quick" data-f="quick">${ic('bolt',19)}<input name="q" placeholder="${ph}" autocomplete="off" enterkeyhint="send"><button aria-label="Adicionar">${ic('arrowUp',20,2)}</button></form>`;
const daysText=d=>d.length===7?'Todos os dias':(d.join()==='1,2,3,4,5'?'Seg a Sex':(d.join()==='1,2,3,4,5,6'?'Seg a Sáb':d.map(i=>WDS[i]).join(', ')));

  }
  return {h:titleHdr('cal','Agenda',C.rose),b:hero+seg+org+v};
};

S.tarefas=()=>{
  const t=today(),fl=[['hoje','Hoje'],['proximas','Próximas'],['semdata','Sem data'],['atrasadas','Atrasadas'],['feitas','Feitas']];
  const F={hoje:x=>!x.done&&x.date===t,proximas:x=>!x.done&&x.date>t,semdata:x=>!x.done&&!x.date,atrasadas:x=>!x.done&&x.date&&x.date<t,feitas:x=>x.done};
  let L=state.tasks.filter(F[ui.taskFilter]);
  L.sort((a,b)=>ui.taskFilter==='feitas'?(b.doneAt||0)-(a.doneAt||0):(a.date||'9').localeCompare(b.date||'9'));
  if(ui.taskFilter==='feitas')L=L.slice(0,40);
  const b=`${quickForm('Ex.: ligar pro contador sexta')}<div class="chips scroll" style="margin-top:16px">${fl.map(([k,l])=>`<button class="chip ${ui.taskFilter===k?'on':''}" data-a="taskF" data-v="${k}">${l} <span class="muted" style="${ui.taskFilter===k?'color:#fff;opacity:.7':''}">${state.tasks.filter(F[k]).length}</span></button>`).join('')}</div>
  <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary" data-a="sheet" data-s="task">${ic('plus',16)} Nova tarefa</button></div>
  <div class="card">${L.map(x=>tkRow(x,true)).join('')||'<div class="empty">Nada aqui.</div>'}</div>${ui.taskFilter==='feitas'&&L.length?'<button class="btn ghost full" style="margin-top:12px" data-a="clearDone">Limpar concluídas</button>':''}`;
  return {h:titleHdr('task','Tarefas',C.sky),b};
};

  let b=tab;
  if(ui.habitTab==='do'){
    const hs=doHabits().filter(x=>sched(x,t)),hd=hs.filter(x=>hDone(x,t)).length,p=hs.length?hd/hs.length:0,ws=weekStart(t);
    const week=[0,1,2,3,4,5,6].map(i=>{const d=addDays(ws,i),r=d>t?0:(dayRatio(d)||0);return `<div class="hwc"><div class="hwb"><em style="height:${Math.round(r*100)}%"></em></div><span class="${d===t?'t':''}">${WDS[parseISO(d).getDay()]}</span></div>`}).join('');
    b+=`<div class="hero"><div class="hmain">${ring(p,'var(--sage)',pctBig(Math.round(p*100)),'feito')}<div><div class="hk g">Hoje</div><div class="hT">${hd} de ${hs.length} hábitos feitos</div><div class="hS">${ic('flame',12)} Sequência de ${allStreak()} dias · recorde ${state.habitRecord||0}</div></div></div>${stats([[monthHabitPct()+'%','no mês'],[doHabits().filter(x=>hStreak(x)>0).length,'em dia'],[doHabits().length,'hábitos']])}<div class="hw">${week}</div></div>`;
    b+=`<h2 class="sec">Meus hábitos</h2><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="seg"><button class="${ui.habitView==='lista'?'on':''}" data-a="habitView" data-v="lista">${ic('list',15)} Lista</button><button class="${ui.habitView==='cal'?'on':''}" data-a="habitView" data-v="cal">${ic('cal',15)} Calendário</button></div><button class="btn primary sm" style="margin-left:auto" data-a="sheet" data-s="habit">${ic('plus',14)} Novo</button></div>`;
    if(ui.habitView==='lista'){
      b+=doHabits().map(h=>{const dn=hDone(h,t),sc=sched(h,t),st=hStreak(h),ex=ui.expanded[h.id];
        let grid='';if(ex){grid='<div class="grid28">';for(let i=27;i>=0;i--){const d=addDays(t,-i);grid+=`<i class="${!sched(h,d)?'off':hDone(h,d)?'on':''}" title="${d}"></i>`}grid+='</div><div class="small muted" style="margin-top:6px">Últimos 28 dias</div>'}
        return `<div class="hcard"><div class="hrow"><div class="hic">${ic('sprout',17)}</div><div class="grow"><b>${esc(h.name)}</b><div class="small"><span class="sagec">${esc(h.cat)}</span> <span class="fl">${ic('flame',11)} ${st}d</span></div><div class="small muted">${daysText(h.days)}${!sc?' · folga hoje':''}${h.auto==='water'?' · automático pela água':''}</div></div><button class="btn sm ${dn?'ok':'ghost'}" data-a="habitDone" data-id="${h.id}">${dn?ic('check',13,2.4)+' Feito':'Marcar'}</button></div><div style="display:flex;justify-content:flex-end;gap:2px;margin-top:4px"><button class="ib sm" data-a="sheet" data-s="habit" data-id="${h.id}">${ic('edit',15)}</button><button class="ib sm" data-a="delHabit" data-id="${h.id}">${ic('trash',15)}</button><button class="ib sm" data-a="expand" data-id="${h.id}" style="${ex?'transform:rotate(180deg)':''}">${ic('chevD',16)}</button></div>${grid}</div>`}).join('')||'<div class="empty">Crie seu primeiro hábito.</div>';
    }else{
      const m=ym(t),gs=weekStart(m+'-01');let cells=WDS.slice(1).concat('Dom').map(x=>`<div class="h">${x}</div>`).join('');
      for(let i=0;i<42;i++){const d=addDays(gs,i);if(i>=35&&ym(d)!==m)break;const r=d>t?null:dayRatio(d);const bg=r==null?'#fff':`rgba(156,197,161,${.15+r*.85})`;cells+=`<button class="${ym(d)!==m?'out':''} ${d===t?'today':''}" style="background:${bg};${r===1?'color:#fff;font-weight:600':''}">${parseISO(d).getDate()}</button>`}
      b+=`<div class="card"><div class="cardHead"><h4>${monthLabel(m)}</h4><span class="small muted">quanto mais verde, mais hábitos feitos</span></div><div class="cal">${cells}</div></div>`;
    }
  }else{
    b+=`<div class="card" style="margin-top:0"><div class="small muted">Acompanhe o que você quer deixar pra trás: refrigerante, doce à noite, rolar o feed antes de dormir… Conta os dias desde a última vez.</div></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary sm" data-a="sheet" data-s="habit" data-type="quit">${ic('plus',14)} Novo</button></div>`;
    b+=quitHabits().map(h=>{const n=daysBetween(h.since,t),best=Math.max(h.best||0,n);return `<div class="hcard"><div class="hrow"><div class="hic" style="background:var(--rose-l);color:var(--rose-d)">${ic('stop',17)}</div><div class="grow"><b>${esc(h.name)}</b><div class="small muted">Recorde: ${best} ${best===1?'dia':'dias'}</div></div><div style="text-align:right"><div class="big">${n}</div><div class="small muted">${n===1?'dia sem':'dias sem'}</div></div></div><div style="display:flex;justify-content:flex-end;gap:4px;margin-top:6px"><button class="btn sm ghost" data-a="sheet" data-s="relapse" data-id="${h.id}">Recaí</button><button class="ib sm" data-a="delHabit" data-id="${h.id}">${ic('trash',15)}</button></div></div>`}).join('')||'<div class="empty">Nenhum ainda.</div>';
  }
  return {h:titleHdr('sprout','Hábitos',C.sage),b};
};

function waterCard(){
  const t=today(),w=state.water[t]||0,g=state.settings.waterGoal,cup=state.settings.cup,n=Math.min(14,Math.ceil(g/cup)),full=Math.floor(w/cup);
  return `<div class="card"><div class="hrow"><div class="hic" style="background:var(--sky-l);color:#7fa9bb">${ic('drop',17)}</div><div class="grow"><b class="serif" style="font-family:var(--serif);font-size:18px;font-weight:400">Água</b><div class="small muted">Meta de ${(g/1000).toLocaleString('pt-BR')} L por dia</div></div><div class="big">${(w/1000).toLocaleString('pt-BR',{maximumFractionDigits:2})}<small> L</small></div></div>
  <div class="bar" style="margin-top:14px"><i style="width:${Math.min(100,w/g*100)}%;background:var(--sky)"></i></div>
  <div class="cups">${Array.from({length:n},(_,i)=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" class="${i<full?'f':''}">${I.glass}</svg>`).join('')}</div>
  <div style="display:flex;gap:10px"><button class="circ" style="width:46px;height:46px" data-a="water" data-n="-${cup}">${ic('minus',18)}</button><button class="btn full" style="background:var(--sky);color:#fff" data-a="water" data-n="${cup}">${ic('plus',16)} ${cup} ml</button><button class="btn ghost" data-a="water" data-n="500">500</button></div></div>`;
}
function sleepCard(){

  <div class="slabels">${days.map(d=>`<span>${WDS[parseISO(d).getDay()]}</span>`).join('')}</div>
  <button class="btn soft full" style="margin-top:14px;background:var(--lav-l);color:#7d6a9e" data-a="sheet" data-s="sleep">${ic('plus',15)} Registrar sono</button></div>`;
}
function medsCard(){

}
S.saude=()=>{
  const t=today(),w=state.water[t]||0,g=state.settings.waterGoal,last=state.sleep[t]??state.sleep[addDays(t,-1)],ml=state.medLog[t]||{};
  const cons=state.events.filter(e=>e.cat==='saude'&&e.date>=t&&e.date<=addDays(t,60)).length;
  const tabs=[['geral','Visão geral','heart'],['agua','Água e sono','drop'],['rem','Remédios','pill']];
  let b=`<div class="seg" style="margin-bottom:16px">${tabs.map(([k,l,i])=>`<button class="${ui.healthTab===k?'on':''}" data-a="healthTab" data-v="${k}">${ic(i,15)} ${l}</button>`).join('')}</div>`;
  b+=`<div class="hero"><div class="hmain">${ring(w/g,'var(--sage)',pctBig(Math.round(Math.min(1,w/g)*100)),'água')}<div><div class="hk g">Seu corpo hoje</div><div class="hT">${(w/1000).toLocaleString('pt-BR',{maximumFractionDigits:2})} L de ${(g/1000).toLocaleString('pt-BR')} L de água</div><div class="hS">Cuidar de você também entra na rotina.</div></div></div>${stats([[fmtDur(last),'última noite'],[`${state.meds.filter(m=>ml[m.id]).length}/${state.meds.length}`,'remédios hoje'],[cons,cons===1?'consulta':'consultas']])}</div>`;

  }else b+=medsCard()+`<div class="card"><div class="cardHead"><h4>Consultas e exames</h4><button class="ib sm" data-a="sheet" data-s="event" data-cat="saude">${ic('plus',17)}</button></div>${state.events.filter(e=>e.cat==='saude'&&e.date>=t).sort(sortEv).map(e=>evRow(e,true)).join('')||'<div class="empty">Nenhuma consulta marcada. Eventos com a categoria Saúde aparecem aqui.</div>'}</div>`;

const listMeta={mercado:['Supermercado','cart',C.sage,'#7fae86'],wishlist:['Wishlist','gem',C.rose,'var(--rose-d)'],checklist:['Checklist','task',C.sky,'#7fa9bb']};
function listCards(){
  let L=state.lists.filter(l=>ui.listFilter==='todas'||l.type===ui.listFilter);
  if(ui.listSearch){const q=norm(ui.listSearch);L=L.filter(l=>norm(l.name).includes(q)||l.items.some(i=>norm(i.text).includes(q)))}
  L.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  return L.map(l=>{const[mt,icn,bg,col]=listMeta[l.type]||listMeta.checklist,dn=l.items.filter(i=>i.done).length;
    return `<button class="lcard" data-a="openList" data-id="${l.id}"><div class="hrow"><div class="lic" style="background:${bg};color:${col}">${ic(icn,17)}</div><div class="grow"><div style="font-family:var(--serif);font-size:18px">${esc(l.name)}</div><div class="small muted">${mt} · ${l.items.length} ${l.items.length===1?'item':'itens'}</div></div>${l.pinned?`<span style="color:var(--rose-d)">${ic('pin',16)}</span>`:''}</div>${l.items.length?`<ul>${l.items.slice(0,4).map(i=>`<li class="${i.done?'d':''}">${esc(i.text)}</li>`).join('')}${l.items.length>4?`<li style="color:var(--muted)">+${l.items.length-4}</li>`:''}</ul><div class="bar" style="height:6px"><i style="width:${dn/l.items.length*100}%;background:${col}"></i></div><div class="small muted" style="margin-top:6px">${dn} de ${l.items.length}</div>`:'<div class="small muted" style="margin-top:10px">Lista vazia</div>'}</button>`}).join('')||'<div class="empty">Nenhuma lista encontrada.</div>';
}

/* ---------- adição rápida (substitui a IA) ---------- */
function quick(text){
  text=text.trim();if(!text)return null;
  const toks=text.split(/\s+/),nt=toks.map(x=>norm(x).replace(/[.,;!?:]+$/,'')),drop=new Array(toks.length).fill(false);
  const t=today();let date=null,time=null,amount=null,dayNum=null,m;
  // datas
  for(let i=0;i<nt.length;i++){
    if(drop[i])continue;const w=nt[i];
    if(w==='depois'&&nt[i+1]==='de'&&nt[i+2]==='amanha'){date=addDays(t,2);drop[i]=drop[i+1]=drop[i+2]=true;continue}
    if(w==='amanha'){date=addDays(t,1);drop[i]=true;continue}
    if(w==='hoje'){date=t;drop[i]=true;continue}
    if(w==='ontem'){date=addDays(t,-1);drop[i]=true;continue}
    if((m=w.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/))){let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;const d=new Date(y,m[2]-1,+m[1]);if(!m[3]&&iso(d)<t)d.setFullYear(y+1);date=iso(d);drop[i]=true;continue}
    const wd=['domingo','segunda','terca','quarta','quinta','sexta','sabado'].findIndex(n=>w===n||w===n+'-feira'||(w.length>=3&&n.startsWith(w)&&['seg','ter','qua','qui','sex','sab','dom'].includes(w)));
    if(wd>=0){let diff=(wd-new Date().getDay()+7)%7;if(diff===0)diff=7;date=addDays(t,diff);drop[i]=true;if(i>0&&['na','no','nesta','neste','proxima','proximo','essa','esse'].includes(nt[i-1]))drop[i-1]=true;continue}
    if(w==='dia'&&/^\d{1,2}$/.test(nt[i+1]||'')){dayNum=+nt[i+1];drop[i]=drop[i+1]=true;continue}
    if((m=w.match(/^(\d{1,2})(?:h|:)(\d{2})?(?:min)?$/))&&+m[1]<24){time=pad(+m[1])+':'+pad(m[2]?+m[2]:0);drop[i]=true;if(i>0&&['as','a','às','ate'].includes(nt[i-1]))drop[i-1]=true;continue}
  }
  const cmd=nt[0];
  // valores
  for(let i=0;i<nt.length;i++){if(drop[i])continue;if(nt[i]==='r$'){drop[i]=true;continue}
    if((m=nt[i].match(/^(?:r\$)?(\d+(?:[.,]\d{1,2})?)(?:reais)?$/))&&amount==null&&i>0){amount=parseAmt(m[1]);drop[i]=true;if(['reais','real'].includes(nt[i+1]))drop[i+1]=true}}
  const STOP=['de','do','da','no','na','em','pra','para','com','o','a','os','as','um','uma','e'];
  const rest=(skipFirst=true)=>{let w=toks.filter((_,i)=>!drop[i]&&!(skipFirst&&i===0));while(w.length&&STOP.includes(norm(w[0])))w.shift();while(w.length&&STOP.includes(norm(w[w.length-1])))w.pop();return w.join(' ').replace(/^[:\-–\s]+/,'').trim()};
  const capT=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
  if(dayNum&&!date&&!['conta','boleto'].includes(cmd)){const n=new Date();let d=new Date(n.getFullYear(),n.getMonth(),dayNum);if(iso(d)<t)d=new Date(n.getFullYear(),n.getMonth()+1,dayNum);date=iso(d)}
  // gasto
  if(['gastei','gasto','paguei','comprei'].includes(cmd)&&amount!=null){const desc=capT(rest())||'Gasto';const d=date||t;return {out:`Gasto ${money(amount)} · ${desc}`,run:()=>state.fin.entries.push({id:uid(),type:'out',desc,amount,date:d,recurring:false,cat:guessCat(desc)})}}
  if(['recebi','receita','ganhei','entrou','salario'].includes(cmd)&&amount!=null){const desc=capT(rest(cmd!=='salario'))||'Receita';const d=date||t;return {out:`Receita ${money(amount)} · ${desc}`,run:()=>state.fin.entries.push({id:uid(),type:'in',desc,amount,date:d,recurring:false})}}
  if(['conta','boleto'].includes(cmd)&&amount!=null){const desc=capT(rest())||'Conta';const day=dayNum||10;return {out:`Conta fixa ${money(amount)} · ${desc} · todo dia ${day}`,run:()=>state.fin.entries.push({id:uid(),type:'out',desc,amount,date:t.slice(0,8)+'01',recurring:true,day,cat:guessCat(desc)})}}
  // água
  if(['agua','bebi'].includes(cmd)){
    let ml=null;for(let i=1;i<nt.length;i++){const w=nt[i];if((m=w.match(/^(\d+(?:[.,]\d+)?)(ml|l|litros?)?$/))){let v=parseFloat(m[1].replace(',','.'));const u=m[2]||(nt[i+1]&&/^(ml|l|litros?)$/.test(nt[i+1])?nt[i+1]:'');if(/^l/.test(u)||(!u&&v<10&&!/copo/.test(nt[i+1]||'')))v*=1000;if(/copo/.test(nt[i+1]||''))v=v*state.settings.cup;ml=Math.round(v);break}if(/copo/.test(w)){ml=state.settings.cup;break}}
    if(amount!=null&&ml==null)ml=amount<10?amount*1000:amount;
    ml=ml||state.settings.cup;const d=date||t;return {out:`Água +${ml} ml`,run:()=>{state.water[d]=(state.water[d]||0)+ml}}
  }
  // sono
  if(['dormi','sono'].includes(cmd)){
    let min=null;const joined=nt.slice(1).join(' ');
    if((m=joined.match(/(\d{1,2})\s*(?:h|:|horas?)\s*(?:e\s*)?(\d{1,2})?/)))min=+m[1]*60+(m[2]?+m[2]:0);
    if(min==null&&time){const[a,b]=time.split(':').map(Number);min=a*60+b}
    if(min!=null){const d=date||t;return {out:`Sono ${fmtDur(min)}`,run:()=>{state.sleep[d]=min}}}
  }
  // devocional
  if((cmd==='conquista'||cmd==='conquistas'||cmd==='vitoria')){const tx=capT(rest());if(tx)return {out:`Conquista · ${tx}`,run:()=>{dEntry(t).wins.push({id:uid(),text:tx});devoMarkHabit(t)}}}
  if(cmd==='versiculo'){const tx=text.trim().split(/\s+/).slice(1).join(' ').replace(/^[:\-–\s]+/,'');if(tx)return {out:`Versículo do dia · ${tx}`,run:()=>{const e=dEntry(t);e.ref=tx;const k=Object.keys(VTXT).find(k=>norm(k)===norm(tx));if(k&&!e.verse){e.ref=k;e.verse=VTXT[k]}devoMarkHabit(t)}}}
  // leitura
  if(['li','lendo','leitura'].includes(cmd)&&amount!=null){const bk=state.books.find(b=>b.status==='lendo');if(bk)return {out:`Leitura +${Math.round(amount)} páginas · ${bk.title}`,run:()=>readPages(bk,amount)}}
  // hábito
  if(['fiz','feito','treinei','li','meditei','orei','marcar'].includes(cmd)){
    const words=nt.slice(1).filter(w=>w.length>2&&!STOP.includes(w));
    const hint={treinei:['trein','muscul','academia'],li:['leitura','ler','livro'],meditei:['medit'],orei:['devoc','ora']}[cmd]||[];
    const h=doHabits().find(h=>{const n=norm(h.name);return words.some(w=>n.includes(w))||hint.some(x=>n.includes(x))});
    if(h){const d=date||t;return {out:`Hábito feito · ${h.name}`,run:()=>{h.log[d]=true}}}
  }
  // lista
  if(['mercado','comprar','lista'].includes(cmd)){
    const raw=rest().replace(/^(de\s+)?(mercado|compras)\s*/i,'');const items=raw.split(/\s*,\s*|\s+e\s+/).map(s=>s.trim()).filter(Boolean);
    if(items.length)return {out:`Mercado +${items.length} ${items.length===1?'item':'itens'}`,run:()=>{let l=state.lists.find(x=>x.type==='mercado'&&x.pinned)||state.lists.find(x=>x.type==='mercado');if(!l){l={id:uid(),name:'Mercado da semana',type:'mercado',pinned:true,items:[]};state.lists.push(l)}items.forEach(s=>l.items.push({id:uid(),text:capT(s),done:false}))}}
  }
  // evento ou tarefa
  const isTask=['tarefa','lembrar','fazer','lembrete'].includes(cmd);
  let title=rest(isTask);if(isTask&&nt[1]==='de')title=title.replace(/^de\s+/i,'');
  if(!isTask)title=rest(false);
  title=capT(title)||capT(text);
  if(time&&!isTask){const d=date||t,cat=/(medic|dentist|consult|exame|terapia|fisio|dermato|gineco|psico)/.test(norm(title))?'saude':'geral';return {out:`Evento · ${title} · ${dateLabel(d)} ${time}`,run:()=>state.events.push({id:uid(),title,date:d,time,cat})}}
  return {out:`Tarefa · ${title}${date?' · '+dateLabel(date):' · sem data'}`,run:()=>state.tasks.push({id:uid(),title,date:date||null,done:false})};
}

const catSel=sel=>fld('Categoria',`<select name="cat">${CATS.map(([c])=>`<option ${c===sel?'selected':''}>${c}</option>`).join('')}</select>`);
const BOOKC=['#d89aa8','#9cc5a1','#a9c6d3','#c9b38f','#b9a7d1','#e5b58f'];
const pagesOn=d=>state.books.reduce((s,b)=>s+((b.log||{})[d]||0),0);
function readStreak(){let d=today(),n=0;if(!pagesOn(d))d=addDays(d,-1);while(pagesOn(d)>0){n++;d=addDays(d,-1)}return n}
function readPages(bk,n){
  const t=today();n=Math.max(0,Math.round(n));if(!n)return false;
  bk.log=bk.log||{};bk.log[t]=(bk.log[t]||0)+n;bk.current=Math.min(bk.pages||1e6,(bk.current||0)+n);
  if(bk.status!=='lido')bk.status='lendo';if(!bk.started)bk.started=t;
  const h=doHabits().find(h=>/leitur|\bler\b|livro/.test(norm(h.name)));if(h)h.log[t]=true;
  if(bk.pages&&bk.current>=bk.pages&&bk.status!=='lido'){bk.status='lido';bk.finished=t;return true}
  return false;
}
function bookCard(b){
  const col=BOOKC[(b.title.charCodeAt(0)||0)%BOOKC.length],pct=b.pages?Math.min(100,Math.round((b.current||0)/b.pages*100)):0;
  let mid='';
  if(b.status==='lendo')mid=`<div class="bar" style="margin-top:10px;height:7px"><i style="width:${pct}%;background:${col}"></i></div><div class="small muted" style="margin-top:5px">p. ${b.current||0}${b.pages?' de '+b.pages+' · '+pct+'%':''}</div>`;

document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset&&el.dataset.devoset){devo()[el.dataset.devoset]=el.value;saveQuiet();return}if(!el.dataset||!el.dataset.devo)return;const d=ui.devoDate||today();dEntry(d)[el.dataset.devo]=el.value;devoMarkHabit(d);saveQuiet()});
Object.assign(A,{
  devoTab:d=>{ui.devoTab=d.v;render();window.scrollTo(0,0)},
  devoOpen:d=>{ui.devoDate=d.d===today()?null:d.d;ui.devoTab='hoje';render();window.scrollTo(0,0)},
  devoNextDay:d=>{const day=ui.devoDate||today();dEntry(day).matDay=String(d.n);devoMarkHabit(day);save()},
  useVerse:d=>{const day=ui.devoDate||today(),e=dEntry(day);e.ref=d.v;if(VTXT[d.v]&&!e.verse)e.verse=VTXT[d.v];devoMarkHabit(day);save()},
  delWin:d=>{const day=ui.devoDate||today(),e=dEntry(day),s=snap();e.wins=e.wins.filter(w=>w.id!==d.id);save();toast('Conquista removida',s)}
});
Object.assign(SH,{devofields:()=>{const f=devoFields();return `<h3>personalizar blocos</h3><div class="small muted" style="margin:-6px 0 14px">Escolha o que aparece no seu devocional. “O que Deus falou comigo” fica sempre.</div><form data-f="devofields">${DEVOF.map(([k,l])=>`<label class="tog"><input type="checkbox" name="f" value="${k}" ${f[k]?'checked':''}> ${l}</label>`).join('')}<button class="btn primary full">Salvar</button></form>`}});
Object.assign(F,{
  devofields:(v,f)=>{const on=new FormData(f).getAll('f');devo().fields=Object.fromEntries(DEVOF.map(([k])=>[k,on.includes(k)]));closeSheet();save()},
  win:v=>{const t_=(v.t||'').trim();if(!t_)return;const day=ui.devoDate||today();dEntry(day).wins.push({id:uid(),text:t_.charAt(0).toUpperCase()+t_.slice(1)});devoMarkHabit(day);save();toast('Conquista anotada ✦');const i=$('#main form[data-f=win] input');if(i)i.focus()}
});
function repDevo(r){
  const days=daysIn(r.a,r.e),done=days.filter(hasDevo),wins=allWins().filter(w=>w.d>=r.a&&w.d<=r.b),refs=done.map(d=>devo().entries[d].ref).filter(Boolean);
  return rcard('devo','#f3ead2','devocional',plural(done.length,'dia com Deus','dias com Deus'),
    `${kpis([[done.length+'/'+days.length,'dias'],[plural(devoStreak(),'dia','dias'),'sequência'],[wins.length,'conquistas']])}${bars(series(r,d=>hasDevo(d)?1:null,'sum'),'#e6cf94')}
    ${(()=>{const ap=done.map(d=>[d,devo().entries[d]]).filter(([,e])=>e.understood).slice(-3).reverse();return ap.length?`<div class="rsub">o que Deus falou comigo</div>${ap.map(([d,e])=>`<div class="subcard" style="margin-top:8px"><div class="small" style="color:var(--rose-d);font-weight:500">${cap(dateLabel(d))}${e.matDay?' · dia '+esc(e.matDay):''}</div><div style="font-size:13.5px;line-height:1.55;margin-top:4px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden">${esc(e.understood)}</div></div>`).join('')}`:''})()}
    ${refs.length?`<div class="rsub">versículos do período</div><div class="chips" style="margin-top:6px">${refs.slice(-12).map(x=>`<span class="chip" style="font-family:var(--script);font-size:17px;color:var(--rose-d)">${esc(x)}</span>`).join('')}</div>`:''}
    ${wins.length?`<div class="rsub">conquistas</div>${wins.slice(0,8).map(w=>`<div class="row" style="padding:7px 0"><span style="color:#d9a54a">✦</span><div class="grow" style="font-size:14px">${esc(w.text)}</div><span class="small muted">${dateLabel(w.d)}</span></div>`).join('')}`:''}`);
}

/* ---------- voltar, arrastar e foto ---------- */
var NAVH=window.NAVH||(window.NAVH={last:null,popping:false});
window.addEventListener('popstate',ev=>{
  if($('#ov').classList.contains('show')){closeSheet();try{history.pushState({s:ui.screen},'')}catch(e){}return}
  NAVH.popping=true;ui.screen=(ev.state&&ev.state.s)||'home';render();window.scrollTo(0,0);NAVH.popping=false;
});
const STANDALONE=!!(window.navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
(()=>{let sx=null,sy=0,dx=0;const W_=()=>document.querySelector('.wrap');
  document.addEventListener('touchstart',e=>{if(!STANDALONE||$('#ov').classList.contains('show')||ui.screen==='home'){sx=null;return}const t=e.touches[0];if(t.clientX<26){sx=t.clientX;sy=t.clientY;dx=0}else sx=null},{passive:true});
  document.addEventListener('touchmove',e=>{if(sx==null)return;const t=e.touches[0];dx=Math.max(0,t.clientX-sx);if(Math.abs(t.clientY-sy)>60&&dx<30){sx=null;W_().style.transform='';return}W_().style.transition='none';W_().style.transform=`translateX(${dx*0.6}px)`},{passive:true});
  document.addEventListener('touchend',()=>{if(sx==null)return;const w=W_();w.style.transition='transform .2s ease';w.style.transform='';if(dx>80)history.back();sx=null},{passive:true});
})();
(()=>{const sh=$('#sheet');let y0=null,dy=0;
  sh.addEventListener('touchstart',e=>{y0=null;if(e.target.closest('textarea,select,input'))return;if(sh.scrollTop>0&&!e.target.closest('.grab'))return;y0=e.touches[0].clientY;dy=0;sh.style.transition='none'},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=dy?`translateY(${dy}px)`:''},{passive:true});
  sh.addEventListener('touchend',()=>{if(y0==null)return;sh.style.transition='transform .2s ease';if(dy>90){sh.style.transform='translateY(100%)';setTimeout(()=>{closeSheet();sh.style.transform='';sh.style.transition=''},180)}else sh.style.transform='';y0=null},{passive:true});
})();
document.addEventListener('change',ev=>{
  if(ev.target.id!=='avatarIn'||!ev.target.files||!ev.target.files[0])return;
  const f=ev.target.files[0],img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);URL.revokeObjectURL(url);state.avatar=c.toDataURL('image/jpeg',0.82);save();toast('Foto atualizada 📸')};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Não consegui abrir essa imagem')};img.src=url;
});
A.rmAvatar=()=>{const s=snap();delete state.avatar;save();toast('Foto removida',s)};

writeLocal();render();
</script>
